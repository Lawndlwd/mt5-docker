# MT5 API on Linux: real Windows (dockur/windows, KVM) + Linux gateway.
#
#   clients -> gateway:8080 (Linux, public) -> windows:9001..900N (MT5 workers, internal only)
#
# Deploy on Dokploy as a "Docker Compose" service with Compose Path:
#   ./docker-compose.yml
# Only the `gateway` service should get a domain. See README.md.

name: mt5-api

services:
  # Runs once per deploy: copies app/, requirements.txt, windows/runtime/ and the
  # settings into the `shared` volume. Exits when done (shown as "exited", that's normal).
  sync:
    build:
      context: .
      dockerfile: sync/Dockerfile
    environment:
      MT5_INSTANCES: ${MT5_INSTANCES:-2}
      WORKER_BASE_PORT: 9001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - shared:/shared
    restart: "no"

  windows:
    image: dockurr/windows:${DOCKUR_TAG:-6.05}
    environment:
      VERSION: ${WINDOWS_VERSION:-11l}          # Windows 11 LTSC (supported to 2034, no bloat)
      RAM_SIZE: ${WINDOWS_RAM:-6G}
      CPU_CORES: ${WINDOWS_CPUS:-4}
      DISK_SIZE: ${WINDOWS_DISK:-64G}
      USERNAME: ${WINDOWS_USER:-Docker}
      PASSWORD: ${WINDOWS_PASSWORD:-admin}
      KEY: ${WINDOWS_KEY:-}                     # optional product key for activation
      # Worker ports; only used if the container falls back to user-mode networking
      # (NAT mode, the default with /dev/net/tun, already forwards every port).
      USER_PORTS: "9001,9002,9003,9004,9005,9006,9007,9008"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      # Web viewer for the Windows desktop (install progress / debugging).
      # Bound to localhost by default: use an SSH tunnel to reach it.
      - "${VIEWER_BIND:-127.0.0.1}:${VIEWER_PORT:-8006}:8006"
    volumes:
      - windows-storage:/storage
      # Copied to C:\OEM and install.bat run once at the end of Windows setup.
      - ./windows/oem:/oem:ro
      # Exposed to Windows as \\host.lan\Data (drive Z:), filled by the `sync` service.
      # The VM resyncs from it on every boot and within ~20 s of a change, so
      # redeploying the repo updates the app without reinstalling Windows.
      - shared:/shared
    depends_on:
      sync:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 2m
    # Healthy while worker 1 answers inside the VM (VM address in NAT mode: 20.20.20.21).
    # Restarting Windows is heavy, so autoheal only acts on it when WINDOWS_AUTOHEAL=true,
    # and only after ~10 min of failures. Frozen MT5 terminals are handled earlier by the
    # supervisor watchdog inside the VM; this is the last resort for a hung VM.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$${VM_IP:-20.20.20.21}/9001' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 20m
    labels:
      autoheal: "${WINDOWS_AUTOHEAL:-false}"

  gateway:
    build: ./gateway
    environment:
      WORKER_HOST: windows
      WORKER_BASE_PORT: 9001
      MT5_INSTANCES: ${MT5_INSTANCES:-2}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}     # if set, clients must send X-API-Key
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-60}       # seconds to wait for a free terminal
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}  # seconds for a single MT5 call
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-15}   # seconds between worker health probes
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Dokploy: attach the domain to gateway:8080 (no host port published).
    expose:
      - "8080"
    depends_on:
      - windows
    restart: unless-stopped
    labels:
      autoheal: "true"   # restarted by `autoheal` when its HEALTHCHECK (Dockerfile) fails

  # Restarts containers labelled autoheal=true when Docker marks them unhealthy
  # (Docker's restart policy only reacts to a container exiting, not to "unhealthy").
  # Needs the Docker socket (read/write): keep this service internal, no ports.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  windows-storage:
  shared:
